# Checks the public site from outside the server. If a check fails, GitHub emails the repo owner,
# which also covers the server or tunnel being down.
name: Watchdog

# The scheduled checks now run on the server (deploy/systemd/depower-watchdog-*.timer); this
# workflow stays for manual checks from outside the server.
on:
  workflow_dispatch:
    inputs:
      check:
        description: What to check
        type: choice
        options: [reach, forecast, score]
        default: reach

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check the public site
        working-directory: pipeline
        env:
          CHECK: ${{ inputs.check || (github.event.schedule == '0 11 * * *' && 'forecast') || 'score' }}
        run: uv run --frozen epf watchdog "$CHECK"
