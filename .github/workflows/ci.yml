name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["data/availability/**"]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -m "not live"
      - name: Forecast log is intact
        run: uv run epf verify-log
      - name: Forecast log is append-only
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        working-directory: .
        run: |
          git fetch --quiet --depth=1 origin "${{ github.event.before }}"
          changed=$(git diff --name-only --diff-filter=MDR FETCH_HEAD HEAD -- data/forecast_log)
          if [ -n "$changed" ]; then
            echo "Logged forecasts must never change:" "$changed"
            exit 1
          fi

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Sample data guard refuses a production build
        run: |
          mkdir -p public/data && cp sample-data/*.json public/data/
          if npm run -s build; then echo "guard failed to stop the build"; exit 1; fi
      - name: Build (labelled sample data, CI only)
        run: npm run build
        env:
          ALLOW_SAMPLE_DATA: "1"
