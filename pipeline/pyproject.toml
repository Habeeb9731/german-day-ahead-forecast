[project]
name = "epf"
version = "0.1.0"
description = "Day-ahead electricity price forecasting for the DE-LU bidding zone"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.1",
  "httpx>=0.27",
  "holidays>=0.60",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
]

[project.scripts]
epf = "epf.cli:main"

[dependency-groups]
dev = ["mypy>=1.11", "pandas-stubs>=2.2", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: calls real APIs; excluded by default (run with -m live)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use naive datetimes because naive UTC is the storage convention.
"tests/*" = ["DTZ001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "holidays.*"]
ignore_missing_imports = true
